
{% extends "base.html" %}

{% block title %}Subtração | Calculadora Web{% endblock %}

{% block content %}

<section class="painel calculadora">

    <p class="etiqueta">OPERAÇÃO MATEMÁTICA</p>
    <h1>Subtração</h1>

    <form class="form-calculo" data-endpoint="/api/subtracao">

        <label for="valor1">Primeiro valor</label>
        <input type="number" id="valor1" name="valor1"
               step="any" required>

        <div class="simbolo">−</div>

        <label for="valor2">Segundo valor</label>
        <input type="number" id="valor2" name="valor2"
               step="any" required>

        <button type="submit">Calcular</button>

    </form>

    <p class="resultado" aria-live="polite">
        O resultado aparecerá aqui.
    </p>

</section>

{% endblock %}
