
{% extends "base.html" %}

{% block title %}Divisão | Calculadora Web{% endblock %}

{% block content %}

<section class="painel calculadora">

    <p class="etiqueta">OPERAÇÃO MATEMÁTICA</p>

    <h1>Divisão</h1>

    <form class="form-calculo" data-endpoint="/api/divisao">

        <label for="valor1">Primeiro valor</label>

        <input type="number"
               id="valor1"
               name="valor1"
               step="any"
               required
               placeholder="Digite o primeiro número">

        <div class="simbolo">÷</div>

        <label for="valor2">Segundo valor</label>

        <input type="number"
               id="valor2"
               name="valor2"
               step="any"
               required
               placeholder="Digite o segundo número">

        <button type="submit">Calcular</button>

    </form>

    <p class="resultado" aria-live="polite">
        O resultado aparecerá aqui.
    </p>

</section>

{% endblock %}
